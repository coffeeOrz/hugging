<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>时间胶囊 · Time Capsule</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --blur-bg: rgba(255, 255, 255, 0.18);
      --border: rgba(255, 255, 255, 0.35);
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.75);
    }

    * {
      box-sizing: border-box;
      font-family: "Segoe UI", "PingFang SC", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(120deg, #2b5876, #4e4376);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      transition: background 2s ease;
    }

    .capsule {
      width: 92%;
      max-width: 520px;
      padding: 28px;
      border-radius: 20px;
      background: var(--blur-bg);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
      animation: floatIn 1.2s ease;
    }

    @keyframes floatIn {
      from {
        transform: translateY(40px) scale(0.96);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 1px;
    }

    .time {
      margin-top: 6px;
      font-size: 13px;
      color: var(--text-sub);
    }

    textarea {
      margin-top: 18px;
      width: 100%;
      min-height: 120px;
      resize: none;
      padding: 14px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    textarea::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    .controls {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    input[type="date"] {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
      outline: none;
    }

    button {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #333;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .result {
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-sub);
      min-height: 22px;
    }

    footer {
      margin-top: 22px;
      font-size: 12px;
      text-align: center;
      color: rgba(255, 255, 255, 0.55);
    }
  </style>
</head>

<body>
  <div class="capsule">
    <h1>时间胶囊</h1>
    <div class="time" id="nowTime"></div>

    <textarea
      id="message"
      placeholder="写一段话，留给未来的自己……"
    ></textarea>

    <div class="controls">
      <input type="date" id="openDate" />
      <button onclick="sealCapsule()">封存</button>
    </div>

    <div class="result" id="result"></div>

    <footer>
      本地运行 · 不上传 · 属于你的静态网页
    </footer>
  </div>

  <script>
    const nowTimeEl = document.getElementById("nowTime");
    const resultEl = document.getElementById("result");

    function updateTime() {
      const now = new Date();
      nowTimeEl.textContent =
        "现在是：" + now.toLocaleString();
    }

    updateTime();
    setInterval(updateTime, 1000);

    function sealCapsule() {
      const text = document.getElementById("message").value.trim();
      const date = document.getElementById("openDate").value;

      if (!text || !date) {
        resultEl.textContent = "请填写内容并选择未来日期。";
        return;
      }

      const openTime = new Date(date);
      const now = new Date();

      if (openTime <= now) {
        resultEl.textContent = "时间必须是未来。";
        return;
      }

      const days =
        Math.ceil((openTime - now) / (1000 * 60 * 60 * 24));

      resultEl.textContent =
        `已封存。距离开启还有 ${days} 天。`;
    }

    // 根据时间改变背景色（独特效果）
    const hour = new Date().getHours();
    if (hour >= 6 && hour < 12) {
      document.body.style.background =
        "linear-gradient(120deg, #56ccf2, #2f80ed)";
    } else if (hour >= 12 && hour < 18) {
      document.body.style.background =
        "linear-gradient(120deg, #f7971e, #ffd200)";
    } else {
      document.body.style.background =
        "linear-gradient(120deg, #141e30, #243b55)";
    }
  </script>
</body>
</html>
